[project]
name = "quickmigrate-ai"
version = "0.1.0"
description = "Agentic BI-to-QuickSight migration with AWS Transform fallback flagging"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    # boto3 is only needed for QM_MODE=bedrock; mock mode has zero runtime deps.
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "moto[quicksight]>=5.0",   # mock AWS for integration tests
    "python-dotenv>=1.0",       # optional .env loading
]

[project.scripts]
quickmigrate = "quickmigrate.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
